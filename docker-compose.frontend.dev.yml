# Staging compose for the frontend migration. widget/ ONLY — admin/ and
# legal/ are static HTML with no build step, so a staging copy buys nothing
# (decided 2026-09-17, see VERCEL-TO-VPS-MIGRATION-BRIEF.md).
services:
  widget-app-stage:
    container_name: zunkiree-widget-stage
    build:
      context: ./widget
      dockerfile: Dockerfile
    networks:
      - hosting
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hosting"
      - "traefik.http.routers.zunkiree-widget-stage.rule=Host(`dev-widget-zunkiree.zunkireelabs.com`)"
      - "traefik.http.routers.zunkiree-widget-stage.entrypoints=websecure"
      - "traefik.http.routers.zunkiree-widget-stage.tls=true"
      - "traefik.http.routers.zunkiree-widget-stage.tls.certresolver=letsencrypt"
      - "traefik.http.routers.zunkiree-widget-stage-http.rule=Host(`dev-widget-zunkiree.zunkireelabs.com`)"
      - "traefik.http.routers.zunkiree-widget-stage-http.entrypoints=web"
      - "traefik.http.routers.zunkiree-widget-stage-http.middlewares=zunkiree-widget-stage-redirect"
      - "traefik.http.middlewares.zunkiree-widget-stage-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.zunkiree-widget-stage.loadbalancer.server.port=80"

networks:
  hosting:
    external: true
