server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Headers — must match widget/vercel.json exactly. This CORS header is
    # the ONLY reason client sites can load /zunkiree-widget.iife.js
    # cross-origin. If this is missing, the URL still resolves and the
    # container stays healthy — but every client's widget breaks silently
    # in THEIR browser console, not in our logs.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json text/javascript;

    # No rewrites in widget/vercel.json — serve dist/ as-is.
    location / {
        try_files $uri $uri/ =404;
    }
}
