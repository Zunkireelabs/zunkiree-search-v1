# Zunkiree Search — Docker Compose
# Production: docker compose up -d              (CI passes IMAGE_TAG=<sha>)
# Staging:    docker compose --profile staging up -d
# Dev:        docker compose --profile dev up   (uses build: via override file)
# Backup:     docker compose --profile backup run zunkiree-backup
#
# Image source: prod + staging services pull pre-built images from GHCR by
# SHA tag. CI builds + pushes via release.yml; deploys pull + restart, never
# rebuild on the VPS. Local dev restores `build:` via
# docker-compose.override.yml (gitignored, see docker-compose.override.yml.example).

services:
  zunkiree-search-api:
    image: ghcr.io/zunkireelabs/zunkiree-search-api:${IMAGE_TAG:?IMAGE_TAG must be set or use docker-compose.override.yml for local dev}
    container_name: zunkiree-search-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      # Must match the --workers flag in backend/Dockerfile:18 — DB pool
      # sizing (backend/app/database.py) divides its socket budget by this.
      - UVICORN_WORKERS=2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - backup-data:/backups
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zunkiree-search-api.rule=Host(`api.zunkireelabs.com`)"
      - "traefik.http.routers.zunkiree-search-api.entrypoints=websecure"
      - "traefik.http.routers.zunkiree-search-api.tls.certresolver=letsencrypt"
      # HSTS — force HTTPS for ~1 year after first secure visit
      - "traefik.http.middlewares.hsts-zunkiree-api.headers.stsSeconds=31536000"
      - "traefik.http.routers.zunkiree-search-api.middlewares=hsts-zunkiree-api"
      - "traefik.http.services.zunkiree-search-api.loadbalancer.server.port=8000"
    networks:
      - hosting

  # Local development (no Traefik, exposes port directly)
  zunkiree-search-api-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zunkiree-search-api-dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    profiles:
      - dev

  # Staging — runs the `stage` branch via deploy-staging.yml workflow.
  # Container lives at /home/zunkireelabs/devprojects/zunkiree-search-v1-stage
  # on the VPS; reads its env from backend/.env.staging in that dir.
  # Single-DB until Phase C — points at same Supabase as prod.
  zunkiree-search-api-stage:
    image: ghcr.io/zunkireelabs/zunkiree-search-api:${IMAGE_TAG:?IMAGE_TAG must be set or use docker-compose.override.yml for local dev}
    container_name: zunkiree-search-api-stage
    restart: unless-stopped
    env_file:
      - ./backend/.env.staging
    environment:
      - ENVIRONMENT=staging
      # Must match the --workers flag on the command line below — DB pool
      # sizing (backend/app/database.py) divides its socket budget by this.
      - UVICORN_WORKERS=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zunkiree-stage.rule=Host(`staging-api.zunkireelabs.com`)"
      - "traefik.http.routers.zunkiree-stage.entrypoints=websecure"
      - "traefik.http.routers.zunkiree-stage.tls.certresolver=letsencrypt"
      # HSTS — force HTTPS for ~1 year after first secure visit
      - "traefik.http.middlewares.hsts-zunkiree-stage.headers.stsSeconds=31536000"
      - "traefik.http.routers.zunkiree-stage.middlewares=hsts-zunkiree-stage"
      - "traefik.http.services.zunkiree-stage.loadbalancer.server.port=8000"
    networks:
      - hosting
    profiles:
      - staging
    # --workers here must match UVICORN_WORKERS above.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

  # Clinic lane (P2 brief §4 B2) — a dedicated single-purpose container
  # serving ONLY the clinic agent (dental-city, and Client #2 once its
  # channels/dates are known — see §7b), reachable from Orca prod only. Same
  # image as the prod API, same Supabase project, but:
  #   - 1 worker: in-process state (ConversationStore, the confirmation gate
  #     in clinic_tools.py) is only correct with one worker per process — see
  #     the comments at those two spots.
  #   - its own 2-socket DB budget (DB_POOL_SIZE/DB_MAX_OVERFLOW), sized from
  #     the B0 measurement in the brief, not guessed — see database.py's
  #     ceiling comment for the three-environment arithmetic (10+2+2=14/15).
  #   - the inbound webhook dispatcher OFF (ENABLE_INBOUND_DISPATCHER=false)
  #     — that's Stella work and belongs to the prod API container, not here.
  #   - CLINICMD_* set only here, in backend/.env.clinic-prod (gitignored;
  #     Sadin sets the values — see .env.clinic-prod.example for the names).
  # No Traefik labels: not given a public host route. It joins the same
  # `hosting` network as everything else on this VPS, so another container
  # on that network (Orca prod) reaches it by Docker DNS at
  # http://zunkiree-clinic-prod:8000 — private-network reachability, not a
  # new public surface. Deploys by manual workflow_dispatch only (see
  # .github/workflows/deploy-clinic-lane.yml), same dispatch-only rule as
  # Orca prod. Built from `main`, same as the prod API.
  zunkiree-clinic-prod:
    image: ghcr.io/zunkireelabs/zunkiree-search-api:${IMAGE_TAG:?IMAGE_TAG must be set or use docker-compose.override.yml for local dev}
    container_name: zunkiree-clinic-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
      - ./backend/.env.clinic-prod
    environment:
      - ENVIRONMENT=production
      - UVICORN_WORKERS=1
      - DB_POOL_SIZE=2
      - DB_MAX_OVERFLOW=0
      - ENABLE_INBOUND_DISPATCHER=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - hosting
    profiles:
      - clinic
    # --workers here must match UVICORN_WORKERS above — see the note atop
    # this service and backend/Dockerfile's pool-sizing comment.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

  zunkiree-backup:
    image: postgres:16-alpine
    container_name: zunkiree-backup
    restart: "no"
    env_file:
      - ./backend/.env
    volumes:
      - backup-data:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    networks:
      - hosting
    profiles:
      - backup

volumes:
  backup-data:
    driver: local

networks:
  hosting:
    external: true
