server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index privacy-policy.html;

    # Headers — must match legal/vercel.json exactly
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json text/javascript;

    # Rewrites — must match legal/vercel.json exactly (8 rewrites).
    # These are the URL shapes likely submitted to Meta App Review — every
    # one must keep resolving.
    location = / {
        try_files /privacy-policy.html =404;
    }
    location = /privacy {
        try_files /privacy-policy.html =404;
    }
    location = /privacy-policy {
        try_files /privacy-policy.html =404;
    }
    location = /terms {
        try_files /terms-of-service.html =404;
    }
    location = /terms-of-service {
        try_files /terms-of-service.html =404;
    }
    location = /tos {
        try_files /terms-of-service.html =404;
    }
    location = /data-deletion {
        try_files /data-deletion.html =404;
    }
    location = /data-deletion-instructions {
        try_files /data-deletion.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
